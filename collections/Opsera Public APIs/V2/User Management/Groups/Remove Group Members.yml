info:
  name: Remove Group Members
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl_publicApi}}/api/v2/usermanagement/group/<groupName>/members"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      [
          "user.name@company.com",
          "another.user@company.com"
        ]
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
