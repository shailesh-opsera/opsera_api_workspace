info:
  name: Delete Filter
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl_publicApi}}/api/v2/insights/filters/<filterId>"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "mappingId": "<mappingId>"
        }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
